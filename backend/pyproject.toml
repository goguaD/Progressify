[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"app/services/meal_service.py" = ["E501", "RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["jose.*", "bcrypt.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "app.routers.*",
    "app.deps",
    "app.services.challenge_service",
    "app.services.user_service",
    "app.services.friend_service",
    "app.repositories.*",
]
disable_error_code = ["arg-type", "assignment", "return-value", "dict-item", "no-any-return"]

[tool.pytest.ini_options]
testpaths = ["tests"]
